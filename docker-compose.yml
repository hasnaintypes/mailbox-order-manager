services:
  postgres:
    image: postgres:17-alpine
    container_name: mailbox-order-manager-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mailbox
      POSTGRES_PASSWORD: mailbox
      POSTGRES_DB: mailbox
    ports:
      - "5432:5432"
    volumes:
      - mailbox_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/01-create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailbox -d mailbox"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mailbox_pgdata:
